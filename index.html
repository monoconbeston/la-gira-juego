<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hitster App</title>
    
    <!-- Configuración para que se comporte como App Móvil (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hitster App">
    <meta name="theme-color" content="#0d0d11">
    
    <!-- Manifiesto de App en línea (Permite la instalación directa en Android y Chrome) -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Hitster%20App%22%2C%22short_name%22%3A%22Hitster%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230d0d11%22%2C%22theme_color%22%3A%22%231db954%22%2C%22icons%22%3B%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3050%2F3050181.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <!-- Librería del Escáner QR de código abierto -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: #161622;
            --accent-color: #1db954; /* Verde Spotify */
            --text-color: #ffffff;
            --text-muted: #a0a0b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        /* --- VISTA ESCÁNER --- */
        #scanner-view {
            display: none;
        }

        #reader {
            width: 100%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(29, 185, 84, 0.2);
        }

        /* --- VISTA REPRODUCTOR --- */
        #player-view {
            display: none;
        }

        /* Animación del Vinilo */
        .vinyl-wrapper {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 25px auto;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #000 30%, #111 31%, #222 50%, #111 68%, #000 70%);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 4s linear infinite;
        }

        .vinyl-center {
            width: 35%;
            height: 35%;
            background-color: var(--accent-color);
            border-radius: 50%;
            border: 4px solid #000;
        }

        /* Contenedor del Reproductor de Spotify con Máscara */
        .spotify-container {
            position: relative;
            width: 100%;
            height: 80px;
            background-color: #282828;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 20px;
        }

        .spotify-iframe {
            width: 100%;
            height: 80px;
            border: none;
        }

        /* MÁSCARA MÁGICA: Tapa el título, portada y autor de Spotify */
        .cover-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% - 130px); /* Deja libre solo el área del botón Play de la derecha */
            height: 100%;
            background-color: #282828;
            display: flex;
            align-items: center;
            padding-left: 20px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }

        .mask-text {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            animation: pulse 2.5s infinite;
        }

        /* BOTÓN DE SIGUIENTE RONDA */
        .btn {
            background-color: var(--accent-color);
            color: black;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            box-shadow: 0 5px 15px rgba(29, 185, 84, 0.4);
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 5px rgba(29, 185, 84, 0.2);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HITSTER APP</h1>
        <div class="subtitle" id="game-status">Preparando cámara...</div>

        <!-- VISTA DE ESCANEO -->
        <div id="scanner-view">
            <div id="reader"></div>
        </div>

        <!-- VISTA DEL REPRODUCTOR -->
        <div id="player-view">
            <div class="vinyl-wrapper">
                <div class="vinyl">
                    <div class="vinyl-center"></div>
                </div>
            </div>
            
            <div id="spotify-player-target">
                <!-- Se inyecta el iframe aquí -->
            </div>

            <button class="btn" onclick="activarEscaneoNuevo()">📷 ESCANEAR SIGUIENTE</button>
        </div>
    </div>

    <script>
        let html5QrCode;
        const config = { fps: 12, qrbox: { width: 230, height: 230 } };

        // Al iniciar la web
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const songId = urlParams.get('id');

            if (songId) {
                // Si la abren directamente con una canción desde el escáner del sistema móvil
                mostrarReproductor(songId);
            } else {
                // Si la abren vacía (como una app instalada), iniciar la cámara interna automáticamente
                activarEscaneoNuevo();
            }
            
            // Registrar mini service-worker para compatibilidad PWA de instalación
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
                `), { scope: './' });
            }
        });

        function activarEscaneoNuevo() {
            // Limpiar parámetro ID de la URL sin recargar la página para limpiar el historial
            window.history.replaceState({}, document.title, window.location.pathname);

            document.getElementById('player-view').style.display = 'none';
            document.getElementById('scanner-view').style.display = 'block';
            document.getElementById('game-status').innerText = 'Apunta a una carta';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            // Arrancar cámara trasera automáticamente
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onQrSuccess,
                onQrError
            ).catch(err => {
                document.getElementById('game-status').innerText = '⚠️ Error al abrir la cámara';
                console.error("Error de cámara:", err);
            });
        }

        function onQrSuccess(decodedText) {
            try {
                // El enlace escaneado será: https://monoconbeston.github.io/reproductor-hitster?id=...
                const url = new URL(decodedText);
                const songId = url.searchParams.get('id');

                if (songId) {
                    // Detener la cámara para ahorrar batería y cargar la canción
                    html5QrCode.stop().then(() => {
                        mostrarReproductor(songId);
                    }).catch(err => {
                        console.error("Error deteniendo cámara:", err);
                        mostrarReproductor(songId); // Forzar carga
                    });
                } else {
                    alert("El QR escaneado no contiene una canción válida del juego.");
                }
            } catch (e) {
                alert("QR no válido. Asegúrate de escanear tus cartas oficiales.");
            }
        }

        function onQrError(errorMessage) {
            // Se ignora el escaneo de cuadros fallidos (ocurre continuamente mientras busca un QR)
        }

        function mostrarReproductor(songId) {
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';
            document.getElementById('game-status').innerText = '¡Adivina la fecha!';

            document.getElementById('spotify-player-target').innerHTML = `
                <div class="spotify-container">
                    <iframe class="spotify-iframe" 
                        src="https://open.spotify.com/embed/track/${songId}?utm_source=generator&theme=0" 
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                        loading="lazy">
                    </iframe>
                    <div class="cover-mask">
                        <span class="mask-text">🎵 Escuchando...</span>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
