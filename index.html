<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor Secreto - Hitster</title>
    <style>
        :root {
            --bg-color: #0d0d11;
            --card-bg: #161622;
            --accent-color: #1db954; /* Verde Spotify */
            --text-color: #ffffff;
            --text-muted: #a0a0b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* Animación del Vinilo */
        .vinyl-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 35px auto;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #000 30%, #111 31%, #222 50%, #111 68%, #000 70%);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 4s linear infinite;
            animation-play-state: paused;
        }

        .vinyl.playing {
            animation-play-state: running;
        }

        .vinyl-center {
            width: 35%;
            height: 35%;
            background-color: var(--accent-color);
            border-radius: 50%;
            border: 4px solid #000;
        }

        /* Contenedor del Reproductor de Spotify con Máscara */
        .spotify-container {
            position: relative;
            width: 100%;
            height: 80px;
            background-color: #282828;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 20px;
        }

        .spotify-iframe {
            width: 100%;
            height: 80px;
            border: none;
        }

        /* MÁSCARA MÁGICA: Tapa el título, portada y autor de Spotify */
        .cover-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% - 130px); /* Deja libre solo el área del botón Play de la derecha */
            height: 100%;
            background-color: #282828;
            display: flex;
            align-items: center;
            padding-left: 20px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none; /* Permite que los clics pasen al reproductor de abajo si es necesario */
        }

        .mask-text {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            animation: pulse 2.5s infinite;
        }

        /* Estado sin canción */
        .no-song {
            color: var(--text-muted);
            padding: 20px;
            font-style: italic;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>REPRODUCTOR SECRETO</h1>
        <div class="subtitle">Juego Musical QR</div>

        <!-- Disco de Vinilo que girará si hay canción cargada -->
        <div class="vinyl-wrapper">
            <div class="vinyl" id="vinylDisk">
                <div class="vinyl-center"></div>
            </div>
        </div>

        <div id="playerArea">
            <!-- El reproductor se cargará dinámicamente aquí -->
        </div>
    </div>

    <script>
        // Obtener el ID de la canción desde la URL (?id=ID_CANCION)
        const urlParams = new URLSearchParams(window.location.search);
        const songId = urlParams.get('id');

        const playerArea = document.getElementById('playerArea');
        const vinylDisk = document.getElementById('vinylDisk');

        if (songId) {
            // Activamos el giro del vinilo
            vinylDisk.classList.add('playing');

            // Creamos el reproductor de Spotify oficial incrustado (Compacto de 80px)
            playerArea.innerHTML = `
                <div class="spotify-container">
                    <iframe class="spotify-iframe" 
                        src="https://open.spotify.com/embed/track/${songId}?utm_source=generator&theme=0" 
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                        loading="lazy">
                    </iframe>
                    <!-- Esta máscara cubre la información reveladora -->
                    <div class="cover-mask">
                        <span class="mask-text">🎵 ESCUCHA CON ATENCIÓN...</span>
                    </div>
                </div>
            `;
        } else {
            // Mensaje si abren la web sin escanear una carta
            playerArea.innerHTML = `
                <div class="no-song">
                    <p>⚠️ No se detectó ninguna canción.</p>
                    <p style="font-size: 0.8rem;">Escanea el código QR de una carta para empezar a jugar.</p>
                </div>
            `;
        }
    </script>
</body>
</html>
