<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Gira: Aventura Musical - Reproductor</title>
    
    <!-- Configuración para que se comporte como App Móvil (PWA) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="La Gira App">
    <link rel="apple-touch-icon" href="icono-escaner.png">
    <meta name="theme-color" content="#0d0c15">
    
    <!-- Manifiesto de App en línea para instalación directa -->
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22La%20Gira%3A%20Aventura%20Musical%22%2C%22short_name%22%3A%22La%20Gira%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230d0c15%22%2C%22theme_color%22%3A%22%23ffd700%22%2C%22icons%22%3B%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F3050%2F3050181.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <!-- Librería del Escáner QR de código abierto -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        :root {
            --bg-color: #06050b;
            --card-bg: #0f0d1a;
            --accent-pink: #ff0055;
            --accent-purple: #822faf;
            --accent-gold: #ffb703;
            --accent-neon-blue: #00f0ff;
            --text-color: #ffffff;
            --text-muted: #8b85b4;
            --success-color: #00f5d4;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(130, 47, 175, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 85, 0.15) 0%, transparent 40%),
                radial-gradient(circle at top, #141126 0%, #06050b 100%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 92%;
            max-width: 410px;
            text-align: center;
            background: linear-gradient(145deg, #131024 0%, #0d0b1a 100%);
            padding: 25px;
            border-radius: 32px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.7),
                0 0 30px rgba(130, 47, 175, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.05);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* Efecto de Luces Neón de Carretera de Fondo */
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 0, 85, 0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        /* --- CABECERA DE LA APP --- */
        .header {
            margin-bottom: 22px;
            position: relative;
            z-index: 2;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px rgba(255, 183, 3, 0.4));
            animation: bounce 2s infinite alternate;
        }

        h1 {
            font-size: 2rem;
            margin: 0;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 10%, var(--accent-gold) 50%, var(--accent-pink) 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(255, 183, 3, 0.2);
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--accent-neon-blue);
            font-size: 0.8rem;
            margin-top: 6px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        /* --- MARCADOR DE REGLAS (Atmósfera de Tablero de Control de Bus) --- */
        .rules-bar {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(130, 47, 175, 0.3);
            border-radius: 16px;
            padding: 12px 15px;
            margin-bottom: 22px;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
            z-index: 2;
        }

        .rule-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .rule-points {
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--accent-gold);
            text-shadow: 0 0 6px rgba(255, 183, 3, 0.5);
        }

        .rule-label {
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
            font-weight: 800;
            margin-top: 3px;
            letter-spacing: 0.5px;
        }

        /* Separador vertical del tablero */
        .rule-divider {
            width: 1px;
            height: 25px;
            background-color: rgba(130, 47, 175, 0.3);
        }

        /* --- VISTA ESCÁNER --- */
        #scanner-view {
            display: none;
            position: relative;
            z-index: 2;
        }

        #reader {
            width: 100%;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 3px dashed var(--accent-pink);
            box-shadow: 
                0 0 30px rgba(255, 0, 85, 0.4),
                inset 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }

        /* --- VISTA REPRODUCTOR --- */
        #player-view {
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 2;
        }

        /* --- NUEVO DISCO / NEUMÁTICO DE TOUR BUS DE GIRA --- */
        .vinyl-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto 25px auto;
        }

        .vinyl {
            width: 100%;
            height: 100%;
            /* Diseño híbrido: Disco de Vinilo de Oro con banda de neumático retro */
            background: 
                radial-gradient(circle, 
                    #151226 15%, 
                    #05050a 16%, 
                    #111 25%, 
                    #222 35%, 
                    #111 40%, 
                    var(--accent-gold) 41%, 
                    #000 44%, 
                    var(--accent-gold) 45%, 
                    #151226 49%, 
                    #333 70%, 
                    #111 75%, 
                    #05050a 82%, 
                    #222 88%, 
                    #05050a 100%);
            border-radius: 50%;
            border: 5px solid var(--accent-gold);
            box-shadow: 
                0 15px 35px rgba(0,0,0,0.8),
                0 0 25px rgba(255, 183, 3, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: spin 3.5s linear infinite;
            position: relative;
        }

        /* Rayos cromados de la llanta/vinilo */
        .vinyl::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                transparent 10%,
                rgba(255, 255, 255, 0.15) 25%,
                transparent 40%,
                transparent 60%,
                rgba(255, 255, 255, 0.15) 75%,
                transparent 90%
            );
            pointer-events: none;
        }

        .vinyl-center {
            width: 32%;
            height: 32%;
            background-color: var(--accent-pink);
            background-image: radial-gradient(circle, var(--accent-gold) 20%, var(--accent-pink) 60%, var(--accent-purple) 100%);
            border-radius: 50%;
            border: 4px solid #06050b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            z-index: 3;
            position: relative;
        }

        /* Centro con el icono del rayo de la gira */
        .vinyl-center::after {
            content: '⚡';
            font-size: 0.95rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        /* Contenedor del Reproductor de Spotify con Máscara */
        .spotify-container {
            position: relative;
            width: 100%;
            height: 80px;
            background-color: #121212;
            border-radius: 18px;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 
                0 8px 25px rgba(0,0,0,0.5),
                0 0 15px rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.15);
        }

        .spotify-iframe {
            width: 100%;
            height: 80px;
            border: none;
        }

        /* MÁSCARA MÁGICA: Oculta los datos para que no se arruine la sorpresa */
        .cover-mask {
            position: absolute;
            top: 0;
            left: 0;
            width: calc(100% - 130px); /* Tapa todo menos el play de Spotify */
            height: 100%;
            background: linear-gradient(135deg, #16151f 0%, #0d0c15 100%);
            display: flex;
            align-items: center;
            padding-left: 20px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.3s ease;
            border-right: 2px solid var(--accent-pink);
        }

        .mask-text {
            color: var(--accent-gold);
            font-weight: 900;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            animation: pulse 1.8s infinite;
            text-shadow: 0 0 8px rgba(255, 183, 3, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* --- BOTÓN DE REVELAR SECRETO --- */
        .secret-reveal-btn {
            background-color: rgba(130, 47, 175, 0.15);
            color: var(--accent-neon-blue);
            border: 1.5px solid rgba(0, 240, 255, 0.4);
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .secret-reveal-btn:active {
            background-color: rgba(0, 240, 255, 0.15);
            transform: scale(0.96);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
        }

        /* --- BOTÓN DE SIGUIENTE RONDA --- */
        .btn-scan-next {
            background: linear-gradient(135deg, var(--accent-pink) 0%, var(--accent-purple) 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            margin-top: 25px;
            box-shadow: 
                0 6px 20px rgba(255, 0, 85, 0.4),
                0 0 15px rgba(130, 47, 175, 0.2);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        .btn-scan-next:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(255, 0, 85, 0.2);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-5px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- VISTA DE AUTORIZACIÓN DE SPOTIFY --- */
        #auth-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .auth-card {
            background: rgba(255, 183, 3, 0.08);
            border: 2px solid var(--accent-gold);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 20px;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(255, 183, 3, 0.1);
        }

        .auth-icon {
            font-size: 3.2rem;
            margin-bottom: 12px;
            animation: pulse 1.5s infinite;
        }

        .auth-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--accent-gold);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-instructions {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 15px;
            text-align: left;
        }

        .url-box {
            background: #000;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.75rem;
            word-break: break-all;
            user-select: all;
            -webkit-user-select: all;
            color: var(--accent-neon-blue);
            margin-bottom: 15px;
            max-height: 80px;
            overflow-y: auto;
        }

        /* Estilo general para botones comunes */
        .btn {
            background-color: var(--accent-purple);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 0.85rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.97);
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- CABECERA DE LA APP (Oficial de La Gira) -->
        <div class="header">
            <div class="logo-container">🚌📻</div>
            <h1>LA GIRA</h1>
            <div class="subtitle" id="game-status">Sintonizador Oficial</div>
        </div>

        <!-- MARCADOR DE REGLAS (Atmósfera de Tablero de Control de Bus) -->
        <div class="rules-bar">
            <div class="rule-item">
                <span class="rule-points">3 pts</span>
                <span class="rule-label">Nom+Art+Año</span>
            </div>
            <div class="rule-divider"></div>
            <div class="rule-item">
                <span class="rule-points">2 pts</span>
                <span class="rule-label">2 Datos</span>
            </div>
            <div class="rule-divider"></div>
            <div class="rule-item">
                <span class="rule-points">1 pt</span>
                <span class="rule-label">1 Dato</span>
            </div>
        </div>


        <!-- VISTA DE AUTORIZACIÓN DE SPOTIFY (EVITA CÁMARA Y RETIENE URL) -->
        <div id="auth-view">
            <div class="auth-card">
                <div class="auth-icon">🔑</div>
                <div class="auth-title">¡Código de Gira Generado!</div>
                <div class="auth-instructions">
                    Has iniciado sesión con éxito en Spotify. Para activar el mazo en tu Mac, copia la dirección completa de esta página (URL) y pégala en la terminal.
                </div>
                <div class="url-box" id="url-text-box">Cargando enlace...</div>
                <button class="btn" onclick="copiarUrlAlPortapapeles()" style="margin-top: 5px; width: 100%; background-color: var(--accent-pink);">📋 COPIAR ENLACE GIGANTE</button>
            </div>
            <button class="btn" onclick="omitirAutorizacion()" style="background-color: #241f3e; color: white; margin-top: 10px; width: 100%; box-shadow: none; border: 1px solid rgba(255,255,255,0.1);">Omitir e ir al Escáner</button>
        </div>

        <!-- VISTA DE ESCANEO -->
        <div id="scanner-view">
            <div id="reader"></div>
        </div>

        <!-- VISTA DEL REPRODUCTOR -->
        <div id="player-view">
            <div class="vinyl-wrapper">
                <div class="vinyl">
                    <div class="vinyl-center"></div>
                </div>
            </div>
            
            <div id="spotify-player-target">
                <!-- El iframe de Spotify se carga aquí -->
            </div>

            <!-- Botón opcional para tarareo / escucha secreta -->
            <button class="secret-reveal-btn" id="btn-secret-reveal" onclick="toggleSecretReveal()">
                🕵️ MODO SECRETO: VER CANCIÓN
            </button>

            <button class="btn-scan-next" onclick="activarEscaneoNuevo()">📷 ESCANEAR SIGUIENTE QR</button>
        </div>
    </div>

    <script>
        let html5QrCode;
        const config = { fps: 12, qrbox: { width: 230, height: 230 } };
        let isRevealed = false;

        // Al iniciar la web
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const songId = urlParams.get('id');
            const spotifyCode = urlParams.get('code');

            if (spotifyCode) {
                // Si detectamos el código de Spotify, mostramos la pantalla de copia y NO abrimos la cámara
                mostrarPantallaAutorizacion();
            } else if (songId) {
                // Si la abren directamente con una canción desde el escáner del sistema móvil
                mostrarReproductor(songId);
            } else {
                // Si la abren vacía (como una app instalada), iniciar la cámara interna automáticamente
                activarEscaneoNuevo();
            }
            
            // Registrar mini service-worker para compatibilidad PWA de instalación
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('data:application/javascript,' + encodeURIComponent(`
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
                `), { scope: './' });
            }
        });

        function mostrarPantallaAutorizacion() {
            document.getElementById('player-view').style.display = 'none';
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('auth-view').style.display = 'flex';
            document.getElementById('game-status').innerText = '🔑 Autorización Spotify';
            
            // Colocar la URL actual en la caja de texto
            document.getElementById('url-text-box').innerText = window.location.href;
        }

        function copiarUrlAlPortapapeles() {
            const urlText = window.location.href;
            navigator.clipboard.writeText(urlText).then(() => {
                alert("¡Enlace copiado al portapapeles! Pégalo en tu terminal de Mac.");
            }).catch(err => {
                // Fallback manual si clipboard falla
                const range = document.createRange();
                range.selectNode(document.getElementById('url-text-box'));
                window.getSelection().removeAllRanges();
                window.getSelection().addRange(range);
                document.execCommand("copy");
                alert("Seleccionado. Copia el texto manualmente si no se copió.");
            });
        }

        function omitirAutorizacion() {
            document.getElementById('auth-view').style.display = 'none';
            activarEscaneoNuevo();
        }

        function activarEscaneoNuevo() {
            // Limpiar parámetro ID de la URL sin borrar el resto de cosas si no es ID
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('id')) {
                urlParams.delete('id');
                const newQuery = urlParams.toString();
                const newPath = window.location.pathname + (newQuery ? '?' + newQuery : '');
                window.history.replaceState({}, document.title, newPath);
            }

            isRevealed = false;

            document.getElementById('player-view').style.display = 'none';
            document.getElementById('scanner-view').style.display = 'block';
            document.getElementById('game-status').innerText = 'Apunta al QR de una carta';

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            // Iniciar escaneo usando la cámara trasera
            html5QrCode.start(
                { facingMode: "environment" }, 
                config,
                onQrSuccess,
                onQrError
            ).catch(err => {
                document.getElementById('game-status').innerText = '⚠️ Error al abrir la cámara';
                console.error("Error de cámara:", err);
            });
        }

        function onQrSuccess(decodedText) {
            try {
                const url = new URL(decodedText);
                const songId = url.searchParams.get('id');

                if (songId) {
                    html5QrCode.stop().then(() => {
                        mostrarReproductor(songId);
                    }).catch(err => {
                        console.error("Error al apagar cámara:", err);
                        mostrarReproductor(songId);
                    });
                } else {
                    alert("El QR escaneado no contiene un ID de canción válido.");
                }
            } catch (e) {
                alert("Código QR no válido. Escanea una carta de La Gira.");
            }
        }

        function onQrError(errorMessage) {
            // Se ignora para no inundar la consola
        }

        function mostrarReproductor(songId) {
            document.getElementById('scanner-view').style.display = 'none';
            document.getElementById('player-view').style.display = 'block';
            document.getElementById('game-status').innerText = '📻 ¡RADIO GIRA SONANDO!';

            document.getElementById('spotify-player-target').innerHTML = `
                <div class="spotify-container">
                    <iframe class="spotify-iframe" 
                        src="https://open.spotify.com/embed/track/${songId}?utm_source=generator&theme=0" 
                        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
                        loading="lazy">
                    </iframe>
                    <div class="cover-mask" id="spotify-mask">
                        <span class="mask-text">🚌 Gira Sonando...</span>
                    </div>
                </div>
            `;
            
            // Restablecer botón de revelación
            const btnReveal = document.getElementById('btn-secret-reveal');
            btnReveal.innerText = "🕵️ MODO SECRETO: VER CANCIÓN";
            btnReveal.style.color = "var(--accent-neon-blue)";
            btnReveal.style.borderColor = "rgba(0, 240, 255, 0.4)";
            btnReveal.style.backgroundColor = "rgba(130, 47, 175, 0.15)";
        }

        function toggleSecretReveal() {
            const mask = document.getElementById('spotify-mask');
            const btnReveal = document.getElementById('btn-secret-reveal');

            if (!mask) return;

            if (!isRevealed) {
                const confirmacion = confirm("⚠️ ¿Te aseguraste de que el resto de las bandas no están mirando tu pantalla?");
                if (confirmacion) {
                    mask.style.opacity = '0';
                    mask.style.pointerEvents = 'none';
                    btnReveal.innerText = "🔒 MODO SURGIDO: OCULTAR DATOS";
                    btnReveal.style.color = "var(--accent-pink)";
                    btnReveal.style.borderColor = "var(--accent-pink)";
                    btnReveal.style.backgroundColor = "rgba(255, 0, 85, 0.1)";
                    isRevealed = true;
                }
            } else {
                mask.style.opacity = '1';
                mask.style.pointerEvents = 'none';
                btnReveal.innerText = "🕵️ MODO SECRETO: VER CANCIÓN";
                btnReveal.style.color = "var(--accent-neon-blue)";
                btnReveal.style.borderColor = "rgba(0, 240, 255, 0.4)";
                btnReveal.style.backgroundColor = "rgba(130, 47, 175, 0.15)";
                isRevealed = false;
            }
        }
    </script>
